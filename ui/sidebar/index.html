<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keystone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>Keystone</h1>
      <label class="switch" title="Enable keystone correction">
        <input type="checkbox" id="enabled" checked />
        <span class="track"><span class="thumb"></span></span>
      </label>
    </header>

    <figure class="preview" aria-hidden="true">
      <svg viewBox="-4 -4 168 98">
        <rect class="frame" x="0" y="0" width="160" height="90" rx="2" />
        <polygon id="shape" class="shape" points="0,0 160,0 160,90 0,90" />
      </svg>
    </figure>

    <section class="axis" data-axis="vertical">
      <div class="axis-header">
        <h2>Vertical</h2>
        <output class="value">0.0%</output>
      </div>
      <input type="range" min="-20" max="20" step="0.1" value="0" aria-label="Vertical correction" />
      <div class="axis-footer">
        <span data-side="-1">Bottom narrower</span>
        <span class="tilt"></span>
        <span data-side="1">Top narrower</span>
      </div>
      <div class="stepper">
        <button type="button" data-direction="-1" aria-label="Narrow bottom">−</button>
        <button type="button" data-direction="0" aria-label="Reset vertical">0</button>
        <button type="button" data-direction="1" aria-label="Narrow top">+</button>
      </div>
    </section>

    <section class="axis" data-axis="horizontal">
      <div class="axis-header">
        <h2>Horizontal</h2>
        <output class="value">0.0%</output>
      </div>
      <input type="range" min="-20" max="20" step="0.1" value="0" aria-label="Horizontal correction" />
      <div class="axis-footer">
        <span data-side="-1">Left narrower</span>
        <span class="tilt"></span>
        <span data-side="1">Right narrower</span>
      </div>
      <div class="stepper">
        <button type="button" data-direction="-1" aria-label="Narrow left">−</button>
        <button type="button" data-direction="0" aria-label="Reset horizontal">0</button>
        <button type="button" data-direction="1" aria-label="Narrow right">+</button>
      </div>
    </section>

    <button type="button" id="reset" class="reset">Reset All</button>

    <dl class="shortcuts">
      <dt><kbd data-shortcut="narrowTop"></kbd> <kbd data-shortcut="narrowBottom"></kbd></dt><dd>Narrow top / bottom</dd>
      <dt><kbd data-shortcut="narrowLeft"></kbd> <kbd data-shortcut="narrowRight"></kbd></dt><dd>Narrow left / right</dd>
      <dt><kbd data-shortcut="reset"></kbd></dt><dd>Reset all</dd>
      <dt><kbd data-shortcut="toggle"></kbd></dt><dd>Toggle correction</dd>
    </dl>
  </main>
  <script src="main.js"></script>
</body>
</html>
